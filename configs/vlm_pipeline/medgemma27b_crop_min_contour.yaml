# scripts/vlm_pipeline.py --config configs/vlm_pipeline/medgemma27b_crop_min_contour.yaml
#
# 260831_vlm-is-lesion-crop-sweep-mbhseg25-5cls(Qwen3.5-27B, zeroshot)의 crop_min_contour와
# 같은 데이터/crop_mode로, 모델만 medgemma-27b-it(vision)로 바꿔 비교하기 위한 config.

dataset_json: vlm_datasets/mbh-seg25-5cls/thr0.001/5cls_dataset.json
results_json: exp/260901_vlm-is-lesion-medgemma27B-mbhseg25/output/crop_min_contour/full_results.json
tag: full

stages: [is_lesion, subtype, evaluate]

is_lesion:
  base_url: http://localhost:8892/v1
  model: medgemma-27b-it
  gen_config: medgemma_default
  crop_mode: crop_min_contour
  max_workers: 8

subtype: {}  # 비어있으면 is_lesion 설정을 그대로 상속

evaluate:
  pred_5cls_dir: exp/260821_nnunet-infer-5cls-thr-sweep-mbhseg25/output/thr0.001/pp
  gt_5cls_dir: nnUNet/test_data/Test1_MBHSeg25/labelsTs
  skip_seg_eval: false
